version: '3.8'

services:
  mariadb:
    image: mariadb:11.2
    container_name: innfinder-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: innfinder_db
      MYSQL_USER: innfinder_user
      MYSQL_PASSWORD: innfinder_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb_innfinder_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: innfinder-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      - mariadb

volumes:
  mariadb_innfinder_data:
