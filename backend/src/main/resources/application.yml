server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: innfinder-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt-secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  jwt-expiration-milliseconds: ${APP_JWT_EXPIRATION_MILLISECONDS:86400000}

# Cấu hình DataSource Failover: Mặc định AUTO (Ưu tiên TiDB Cloud, tự động fallback sang Docker Local port 3307 khi mất mạng; hoặc đặt LOCAL/CLOUD)
innfinder:
  datasource:
    mode: ${INNFINDER_DB_MODE:AUTO}
    cloud:
      host: ${INNFINDER_CLOUD_DB_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}
      port: ${INNFINDER_CLOUD_DB_PORT:4000}
      url: ${INNFINDER_CLOUD_DB_URL:jdbc:mariadb://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/innfinder_db?sslMode=verify-full&useUnicode=true&characterEncoding=utf8mb4}
      username: ${INNFINDER_CLOUD_DB_USER:2M9hAfunUGrqrV1.root}
      password: ${INNFINDER_CLOUD_DB_PASSWORD:U12Zrx07qHoBBASg}
    local:
      url: ${INNFINDER_LOCAL_DB_URL:jdbc:mariadb://localhost:3307/innfinder_db?useUnicode=true&characterEncoding=utf8mb4}
      username: ${INNFINDER_LOCAL_DB_USER:innfinder_user}
      password: ${INNFINDER_LOCAL_DB_PASSWORD:innfinder_password}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:mi38qjmj}
  api-key: ${CLOUDINARY_API_KEY:997424842973844}
  api-secret: ${CLOUDINARY_API_SECRET:KnHe5z8pP-D7I-TvgepMCvXMeY0}

# Cấu hình Google Gemini AI Embedding
gemini:
  api-key: ${GEMINI_API_KEY:}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
  fallback-chat-model: ${GEMINI_FALLBACK_CHAT_MODEL:gemini-3.5-flash-lite}
  index-delay-ms: ${GEMINI_INDEX_DELAY_MS:60000}
  request-timeout-seconds: ${GEMINI_REQUEST_TIMEOUT_SECONDS:18}
  embedding-timeout-seconds: ${GEMINI_EMBEDDING_TIMEOUT_SECONDS:8}

# Cấu hình Tra cứu & Cổng đối soát Webhook Casso
casso:
  enabled: ${CASSO_ENABLED:true}
  secure-token: ${CASSO_SECURE_TOKEN:}
  app-id: ${CASSO_APP_ID:trial-app_3c1e7aa6dabfbc3b9e51517e}
  app-secret: ${CASSO_APP_SECRET:sec_JNc1O6gF313FJOiG6IfejyTcVkc7G3xI}

# Cấu hình Cổng đối soát Webhook SePay
sepay:
  enabled: ${SEPAY_ENABLED:false}
  api-key: ${SEPAY_API_KEY:sepay_innfinder_secret_key_2026}
