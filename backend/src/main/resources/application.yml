server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: innfinder-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt-secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  jwt-expiration-milliseconds: ${APP_JWT_EXPIRATION_MILLISECONDS:86400000}

# Cấu hình DataSource Failover: Ưu tiên Cloud, tự động fallback sang Docker Local khi mất mạng
innfinder:
  datasource:
    cloud:
      host: ${INNFINDER_CLOUD_DB_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}
      port: ${INNFINDER_CLOUD_DB_PORT:4000}
      url: ${INNFINDER_CLOUD_DB_URL:jdbc:mariadb://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/innfinder_db?sslMode=verify-full&useUnicode=true&characterEncoding=utf8mb4}
      username: ${INNFINDER_CLOUD_DB_USER:2M9hAfunUGrqrV1.root}
      password: ${INNFINDER_CLOUD_DB_PASSWORD:g5DgMsD2U5TDKvhk}
    local:
      url: ${INNFINDER_LOCAL_DB_URL:jdbc:mariadb://localhost:3307/innfinder_db?useUnicode=true&characterEncoding=utf8mb4}
      username: ${INNFINDER_LOCAL_DB_USER:innfinder_user}
      password: ${INNFINDER_LOCAL_DB_PASSWORD:innfinder_password}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:mi38qjmj}
  api-key: ${CLOUDINARY_API_KEY:997424842973844}
  api-secret: ${CLOUDINARY_API_SECRET:KnHe5z8pP-D7I-TvgepMCvXMeY0}

# Cấu hình Google Gemini AI Embedding
gemini:
  api-key: ${GEMINI_API_KEY:}
