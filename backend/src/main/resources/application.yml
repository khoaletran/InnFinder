server:
  port: 8080

spring:
  application:
    name: innfinder-backend
  datasource:
    url: jdbc:mariadb://localhost:3307/innfinder_db?useUnicode=true&characterEncoding=utf8mb4
    username: innfinder_user
    password: innfinder_password
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

#    cấu hình tham số cho phép upload nhiều file ảnh, đọc từ biến môi trường
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:mi38qjmj}
  api-key: ${CLOUDINARY_API_KEY:997424842973844}
  api-secret: ${CLOUDINARY_API_SECRET:KnHe5z8pP-D7I-TvgepMCvXMeY0}
