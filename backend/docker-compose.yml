version: '3.8'

services:
  mariadb:
    image: mariadb:11.2
    container_name: inn_finder-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: inn_finder_db
      MYSQL_USER: inn_finder_user
      MYSQL_PASSWORD: inn_finder_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: