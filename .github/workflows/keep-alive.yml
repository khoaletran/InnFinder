name: Keep Render Backend Awake

on:
  schedule:
    # Chạy mỗi 12 phút trong khung 07:00 - 23:59 giờ Việt Nam (00:00 - 16:59 UTC)
    - cron: '*/12 0-16 * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health/docs endpoint
        run: |
          curl -fsS --max-time 60 "https://innfinder-backend.onrender.com/v3/api-docs" > /dev/null
          echo "Backend is awake at $(date -u)"
